[package]
name = "menlo"
version = "0.1.0"
description = "Local-first, AI-powered file organiser for macOS."
authors = ["Mayank Sagar"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "menlo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# §2 stack
walkdir = "2"
sha2 = "0.10"
xattr = "1"
trash = "5"

# Approved additions (see PR body): RFC3339 timestamps for the manifest contract,
# batch ids for the journal, and the `mime` field §4.1 mandates.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"

# `notify` arrives with the Phase 3 menu-bar watcher, not before.

[dev-dependencies]
# The mock runtime behind tests/ipc.rs, which drives the real command layer with the
# exact JSON the window sends. Test builds only; the app never links it.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
